[package]
name = "bankml"
version = "0.0.7"
edition = "2021"
authors = ["Professor Codephreak", "Gregory L. Magnusson"]
repository = "https://github.com/cryptoAGI/bankml"
readme = "README.md"
description = "Verified low-bit inference: a zero-dependency Rust runtime for 1-bit (Q1_0) and ternary (Q2_0_g64) GGUF models — guard, pin and kernels bit-exact against llama.cpp b11192"
license = "Apache-2.0"
publish = false

[lib]
path = "bankml.rs"

# Zero dependencies (2026-09-25): sha256, the GGUF parse, f16 and the kernels are in-crate. Each one added
# later carries a comment saying why (design goal: succinct).
[dependencies]

[[bin]]
name = "bankml"
path = "main.rs"

# end-to-end tests of the binary (testing/README.md lists every test and where it lives)
[[test]]
name = "cli"
path = "testing/cli.rs"

[profile.release]
# one static-ish binary, small: the kernels choose AVX2 at run time, so no target-cpu flag is needed
lto = true
codegen-units = 1
panic = "abort"
