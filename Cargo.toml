[package]
name = "bankml"
version = "0.3.7"
edition = "2021"
# 1.99: the C API (capi/) defines a C-variadic function (`bankml_log`), stabilized in 1.99; rust-toolchain.toml pins it
rust-version = "1.99"
authors = ["Professor Codephreak", "Gregory L. Magnusson"]
repository = "https://github.com/cryptoAGI/bankml"
readme = "README.md"
description = "Verified low-bit inference: a zero-dependency Rust runtime for 1-bit (Q1_0) and ternary (Q2_0_g64) GGUF models — guard, pin and kernels bit-exact against llama.cpp b11192"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "bankML/bankml.rs"

# 0.3.2: the C API is a second package in this workspace (capi/, bankml-capi → libbankml.so / libbankml.a). It depends
# on this crate only, so the workspace still has no external crate. `cargo build` / `cargo test` here build this
# package alone (the root is the default member); `cargo build --release -p bankml-capi` builds the library.
[workspace]
members = [".", "capi"]

# Zero dependencies (2026-09-25): sha256, the GGUF parse, f16 and the kernels are in-crate. Each one added
# later carries a comment saying why (design goal: succinct).
[dependencies]

[[bin]]
name = "bankml"
path = "bankML/main.rs"

# end-to-end tests of the binary (testing/README.md lists every test and where it lives)
[[test]]
name = "cli"
path = "testing/cli.rs"

[profile.release]
# one static-ish binary, small: the kernels choose AVX2 at run time, so no target-cpu flag is needed
lto = true
codegen-units = 1
panic = "abort"
