# Offline checks only: the oracles need the model files and the b11192 release, so they stay local
# (`cargo test --release -- --ignored`, see PERFORMANCE.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pinned to the toolchain the kernels were verified with; newer clippy adds style lints
      # (e.g. chunks_exact_to_as_chunks) that -D warnings would fail on
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy && rustup default 1.95.0
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: python3 testing/test_gguf_guard.py
      - run: python3 testing/guard_agree.py target/release/bankml
