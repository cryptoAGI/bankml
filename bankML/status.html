<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bankml serve · status</title>
<style>
:root { --bg: #fbfaf7; --surface: #fff; --ink: #16181d; --muted: #5b6270; --faint: #9aa1ad; --line: #e6e3dc; --accent: #0f766e; --ok: #15803d; --bad: #b42318; --q: #f2efe8;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1013; --surface: #15181d; --ink: #e8e6e1; --muted: #a3a9b4; --faint: #6b7280; --line: #262a31; --accent: #5eead4; --ok: #4ade80; --bad: #f87171; --q: #1b1f26; }
}
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: baseline; gap: 14px; padding: 14px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line); }
header b { font-size: 19px; } header span { color: var(--muted); font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 40px; }
/*STATUS_CSS*/
</style>
</head>
<body>
<header><b>bankML</b><span>bankml serve · status — what this engine measures of itself, now</span></header>
<main id="status"><p>reading /bankml/status…</p></main>
<script>
/*STATUS_JS*/
(function () {
  const root = document.getElementById("status");
  async function tick() {
    try { BankmlStatus.render(root, await (await fetch("/bankml/status", { cache: "no-store" })).json()); }
    catch (e) { root.textContent = "bankml serve did not answer: " + e; }
  }
  tick(); setInterval(tick, 3000);
})();
</script>
</body>
</html>
